<!doctype html><html lang="ko"><meta charset="utf-8"><title>Tank Arcade 실제 엔진 검사</title><style>body{background:#111c25;color:#e8f2f6;font:14px system-ui;padding:24px}button{padding:12px;margin:6px}iframe{width:100%;height:660px;border:1px solid #567}pre{white-space:pre-wrap}</style><h1>실제 게임 엔진 검사</h1><p>소스를 내려받고 localhost에서 실행하세요. 공개 주소에서는 검사 인터페이스가 활성화되지 않습니다.</p><p>자동 플레이는 사람의 플레이 기록이 아닙니다. 비교 조건: SURVIVAL / NORMAL / ASSAULT / 동일 10개 시드 / 동일 순환 이동·발사 / 1/60초 간격. 바뀌는 값은 적 이동 기준값 2.0 → 1.2 하나입니다.</p><button id="boundary">입력·재시작·저장 검사</button><button id="compare">20회 자동 플레이</button><button id="soak">10분 실제 시간 실행</button><button id="download">결과 JSON 저장</button><pre id="out">대기</pre><iframe src="index.html?lab=1" id="gameFrame"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('pre');let report={kind:'Actual engine automated tests',boundary:[],plays:[],soak:null,errors:[]};const show=()=>{out.textContent=JSON.stringify(report,null,2);};const L=()=>frame.contentWindow.TankLab;
window.addEventListener('error',e=>{report.errors.push(e.message);show()});frame.addEventListener('load',()=>frame.contentWindow.addEventListener('error',e=>{report.errors.push(e.message);show()}));
document.querySelector('#boundary').onclick=()=>{const l=L();const add=(name,ok,data)=>report.boundary.push({name,pass:!!ok,data});l.configure(2,41);l.run();const st=performance.now();for(let i=0;i<10;i++)l.input(' ');let s=l.snapshot();add('10 events within 1 second / 10 state changes',s.shotRequests===10&&s.fireQueue===10,{ms:performance.now()-st,requests:s.shotRequests,queue:s.fireQueue});for(let i=0;i<180;i++)l.step(1/60);s=l.snapshot();add('10 queued shots execute exactly once',s.shotsFired===10&&s.fireQueue===0,{fired:s.shotsFired});l.pause();const p=l.snapshot();for(let i=0;i<120;i++)l.step(1/60);add('pause freezes state',JSON.stringify(p)===JSON.stringify(l.snapshot()));l.pause();l.stop();
 for(const kind of ['success','failure']){l.configure(2,41);l.run();l.inject(kind);l.step(1/60);s=l.snapshot();add(kind+' terminal state',s.state===(kind==='success'?'SUCCESS':'FAILURE'),{state:s.state});l.run();s=l.snapshot();add(kind+' restart clears round',s.hp===3&&s.elapsed===0&&s.score===0&&s.fireQueue===0&&s.shotRequests===0&&s.keys.length===0)}
 l.save();const saved=JSON.stringify(l.snapshot().prefs);l.storage(saved);add('valid saved records preserved',JSON.stringify(l.snapshot().prefs)===saved);for(const raw of ['', '{broken', '{"recent":[{}]}','null']){l.storage(raw);s=l.snapshot();add('empty/corrupt save recovery '+raw,s.state==='READY'&&s.prefs.recent.length===0&&s.prefs.bestScore===0)}l.setMotion(true);add('motion setting applied',l.snapshot().prefs.reducedMotion);l.setMute(true);add('mute setting applied',l.snapshot().prefs.mute);show()};
document.querySelector('#compare').onclick=async()=>{report.plays=[];const l=L();l.stop();for(const speed of [2,1.2])for(let trial=1;trial<=10;trial++){l.configure(speed,1000+trial);l.run();let frames=0;while(l.snapshot().state==='RUNNING'&&frames<1802){l.bot();l.step(1/60);frames++}const s=l.snapshot();report.plays.push({trial,seed:1000+trial,enemySpeed:speed,mode:'survival',difficulty:'normal',tank:'assault',state:s.state,time:+s.elapsed.toFixed(3),score:s.score,cause:s.cause||'mission-complete',inputCount:s.shotRequests,frames});show();await new Promise(r=>setTimeout(r,0))}l.stop()};
document.querySelector('#soak').onclick=()=>{if(report.soak?.running)return;const l=L();l.configure(2,99);l.begin();const started=performance.now();let rounds=0,lastFire=0;report.soak={running:true,startedAt:new Date().toISOString(),elapsedSeconds:0,rounds:0};const timer=setInterval(()=>{const s=l.snapshot();const duration=(performance.now()-started)/1000;if(['SUCCESS','FAILURE'].includes(s.state)){rounds++;l.begin()}else if(s.state==='RUNNING'){if(duration-lastFire>.3){l.fire();lastFire=duration}}else if(s.state==='PAUSED'){l.pause()}report.soak.elapsedSeconds=+duration.toFixed(2);report.soak.rounds=rounds;if(duration>=600){clearInterval(timer);if(l.snapshot().state!=='RUNNING')l.begin();const before=l.snapshot().shotRequests;l.fire();report.soak.running=false;report.soak.finishedAt=new Date().toISOString();report.soak.inputWorks=l.snapshot().shotRequests===before+1;report.soak.final=l.snapshot();l.stop()}show()},100)};
document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='tank-real-engine-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
